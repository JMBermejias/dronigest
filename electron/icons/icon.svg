<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0288D1"/>
      <stop offset="100%" style="stop-color:#01579B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256,230)" fill="white">
    <!-- Drone body -->
    <ellipse cx="0" cy="0" rx="45" ry="25" fill="white" opacity="0.95"/>
    <!-- Arms -->
    <line x1="-35" y1="-15" x2="-80" y2="-50" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <line x1="35" y1="-15" x2="80" y2="-50" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <line x1="-35" y1="15" x2="-80" y2="50" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <line x1="35" y1="15" x2="80" y2="50" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <!-- Rotors -->
    <circle cx="-80" cy="-50" r="35" fill="none" stroke="white" stroke-width="4" opacity="0.6"/>
    <circle cx="80" cy="-50" r="35" fill="none" stroke="white" stroke-width="4" opacity="0.6"/>
    <circle cx="-80" cy="50" r="35" fill="none" stroke="white" stroke-width="4" opacity="0.6"/>
    <circle cx="80" cy="50" r="35" fill="none" stroke="white" stroke-width="4" opacity="0.6"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="8" fill="#B3E5FC"/>
  </g>
  <!-- Camera icon -->
  <g transform="translate(256,280)" fill="#B3E5FC">
    <rect x="-15" y="-5" width="30" height="20" rx="4" fill="#B3E5FC"/>
    <circle cx="0" cy="5" r="6" fill="#0288D1"/>
  </g>
  <!-- Text -->
  <text x="256" y="380" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="48" font-weight="bold" letter-spacing="2">DRONIGEST</text>
  <text x="256" y="415" text-anchor="middle" fill="#B3E5FC" font-family="Arial,sans-serif" font-size="20" letter-spacing="4">GESTIÓN DE DRONES</text>
</svg>
